<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Hamudifr, software and AI</title>
  <desc id="desc">A minimal midnight-blue technical banner with cyan orbital geometry and a subtle grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ba3c7" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="960" cy="155" r="220" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".8">
    <circle cx="960" cy="155" r="94"/>
    <ellipse cx="960" cy="155" rx="150" ry="54" transform="rotate(-28 960 155)"/>
    <ellipse cx="960" cy="155" rx="150" ry="54" transform="rotate(48 960 155)"/>
    <path d="M960 30V280M835 155H1085" opacity=".25"/>
  </g>
  <circle cx="1067" cy="91" r="5" fill="#67e8f9"/>
  <circle cx="872" cy="217" r="4" fill="#38bdf8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="86" y="120" fill="#67e8f9" font-size="15" letter-spacing="5">PERSONAL ENGINEERING SPACE</text>
    <text x="82" y="190" fill="#f1f5f9" font-size="64" font-weight="700" letter-spacing="1">HAMUDIFR</text>
    <path d="M86 216H390" stroke="#38bdf8" stroke-width="3"/>
    <text x="86" y="254" fill="#a8b8ce" font-size="18" letter-spacing="3">SOFTWARE  /  AUTOMATION  /  AI</text>
  </g>
</svg>